<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan QR Dokumen Final · SCSB</title>
  <script src="./html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7f5; color: #24332b; font-family: Arial, sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 24px 18px; }
    header { padding: 22px; border-radius: 24px; color: white; background: #0f2a1d; }
    header p { margin: 0; color: #aec3b0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font-size: 21px; }
    section { margin-top: 16px; padding: 18px; border: 1px solid #e2e8e3; border-radius: 24px; background: white; box-shadow: 0 5px 16px #10291a0d; }
    #reader { overflow: hidden; border-radius: 16px; background: #10291a; }
    #message { color: #66736b; font-size: 13px; line-height: 1.5; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 14px; color: white; background: #375543; font-size: 14px; font-weight: 700; cursor: pointer; }
    .back-button { margin-bottom: 14px; padding: 10px 12px; border: 1px solid #dce7dd; color: #375543; background: #f4f7f3; font-size: 12px; }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <main>
    <header>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">
        <div>
          <p>PERBAIKAN BANGUNAN</p>
          <h1>Scan QR Dokumen Final</h1>
        </div>
        <div aria-hidden="true" style="display:flex;width:54px;height:54px;flex:none;align-items:center;justify-content:center;border-radius:18px;background:#e3eed4;color:#375543">
          <svg viewBox="0 0 48 48" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 40V14.5L24 7l15 7.5V40H9Z" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round"/>
            <path d="M17 19h4m6 0h4M17 26h4m6 0h4M21 40V32h6v8" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>
            <path d="m31 9 2-2a5 5 0 0 1 6 6l-2 2-4-1-2-5Z" fill="#8caf78" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="m32 14-8 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </header>
    <section>
      <button id="back" class="back-button" type="button"><span aria-hidden="true">←</span> Kembali ke Update</button>
      <div id="reader"></div>
      <p id="message">Tekan tombol untuk mengaktifkan kamera. Izinkan akses kamera saat diminta.</p>
      <button id="start" type="button">Aktifkan kamera</button>
    </section>
  </main>
  <script>
    let scanner = null;
    const button = document.getElementById("start");
    const backButton = document.getElementById("back");
    const message = document.getElementById("message");
    const returnOrigin = new URLSearchParams(window.location.search).get("returnOrigin") || "";

    function kembaliKeUpdate_() {
      backButton.disabled = true;
      message.textContent = "Menutup pemindai...";
      const kembali = function() {
        if (window.opener && !window.opener.closed) {
          window.opener.focus();
          window.close();
          window.setTimeout(function() {
            if (!window.closed) {
              message.textContent = "Pemindai sudah berhenti. Kembali ke tab aplikasi SCSB.";
              backButton.disabled = false;
            }
          }, 300);
        } else {
          window.history.back();
        }
      };
      if (scanner) {
        scanner.stop().then(function() {
          scanner.clear();
          scanner = null;
          kembali();
        }).catch(function() {
          scanner = null;
          kembali();
        });
      } else {
        kembali();
      }
    }

    backButton.addEventListener("click", kembaliKeUpdate_);

    button.addEventListener("click", function() {
      if (!window.opener || !returnOrigin) {
        message.textContent = "Buka halaman pemindai dari tombol Scan QR di aplikasi SCSB.";
        return;
      }
      if (typeof Html5Qrcode === "undefined") {
        message.textContent = "File pemindai lokal tidak ditemukan. Muat ulang halaman atau periksa file html5-qrcode.min.js.";
        return;
      }
      button.disabled = true;
      message.textContent = "Meminta izin kamera...";
      document.getElementById("reader").innerHTML = "";
      scanner = new Html5Qrcode("reader");
      scanner.start(
        {facingMode: "environment"},
        {fps: 10, qrbox: {width: 240, height: 240}},
        function(decodedText) {
          message.textContent = "QR terbaca. Mengirim kembali ke aplikasi SCSB...";
          scanner.stop().then(function() {
            scanner.clear();
            if (!window.opener) {
              message.textContent = "Aplikasi SCSB asal sudah tidak terbuka. Tutup halaman ini dan mulai scan dari aplikasi.";
              button.disabled = false;
              return;
            }
            let targetOrigin = "";
            try {
              const parsedOrigin = new URL(returnOrigin);
              if (parsedOrigin.protocol === "https:" && parsedOrigin.origin === returnOrigin) targetOrigin = parsedOrigin.origin;
            } catch (error) {}
            if (!targetOrigin) {
              message.textContent = "Asal aplikasi tidak valid. Buka pemindai dari tombol Scan QR di aplikasi SCSB.";
              button.disabled = false;
              return;
            }
            window.opener.postMessage({type: "SCSB_QR_SCAN", decodedText: decodedText}, targetOrigin);
            window.close();
          }).catch(function(error) {
            message.textContent = "Kamera tidak dapat dihentikan dengan benar: " + String(error || "");
            button.disabled = false;
          });
        },
        function() {}
      ).then(function() {
        message.textContent = "Kamera aktif. Arahkan ke QR dokumen final.";
      }).catch(function(error) {
        scanner = null;
        button.disabled = false;
        message.textContent = "Kamera tidak dapat dibuka. Izinkan akses kamera pada browser dan pastikan halaman menggunakan HTTPS. " + String(error || "");
      });
    });

  </script>
</body>
</html>
